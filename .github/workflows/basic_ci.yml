name: Python CI (Basic)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Этап 1. Сборка
  build:
    name: Build - install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Download project source code
        uses: actions/checkout@v4

      - name: Apply reusable Python template
        uses: ./.github/actions/setup-python

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare build artifacts
        run: |
          mkdir -p build-artifacts/src
          cp -R src/cicd_demo build-artifacts/src/
          python -m compileall -q build-artifacts/src/
          python -m pip wheel -r requirements.txt --wheel-dir build-artifacts/wheelhouse
          ls -R build-artifacts/

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 7

  # Этап 2. Тестирование
  test:
    name: Test - pytest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download project source code
        uses: actions/checkout@v4

      - name: Apply reusable Python template
        uses: ./.github/actions/setup-python

      - name: Receive build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts/

      - name: Check and install dependencies from build
        run: |
          test -f build-artifacts/src/cicd_demo/calculator.py
          python -m pip install --no-index --find-links=build-artifacts/wheelhouse -r requirements.txt

      - name: Run unit tests and make a report
        env:
          PYTHONPATH: build-artifacts/src
        run: |
          python -m pytest tests/ -v --junitxml=test-results/report.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  # Этап 3. Упаковка
  package:
    name: Package - create wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download project source code
        uses: actions/checkout@v4

      - name: Apply reusable Python template
        uses: ./.github/actions/setup-python

      - name: Receive build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts/

      - name: Receive test report
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Check transferred files and install dependencies
        run: |
          test -f build-artifacts/src/cicd_demo/calculator.py
          test -f test-results/report.xml
          python -m pip install --no-index --find-links=build-artifacts/wheelhouse -r requirements.txt

      - name: Build and verify the wheel package
        run: |
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
          python -c "from cicd_demo.calculator import add; assert add(2, 3) == 5"
          ls -lh dist/

      - name: Save wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
